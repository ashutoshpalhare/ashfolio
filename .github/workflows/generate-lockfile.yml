name: Generate Dependency Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  generate:
    name: Generate npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile without running lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Create lockfile branch and commit
        run: |
          git switch -c chore/dependency-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add reproducible npm dependency lockfile"
          git push origin chore/dependency-lockfile
