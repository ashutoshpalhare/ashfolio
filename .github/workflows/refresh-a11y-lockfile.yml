name: Refresh accessibility test dependencies

on:
  push:
    branches:
      - test/playwright-accessibility-audit
    paths-ignore:
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a11y-lockfile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out accessibility branch
        uses: actions/checkout@v4
        with:
          ref: test/playwright-accessibility-audit
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add browser accessibility test dependencies
        run: npm install --save-dev @axe-core/playwright @playwright/test --ignore-scripts --no-audit --no-fund

      - name: Commit updated package metadata and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "test: add Playwright accessibility dependencies"
          git push origin HEAD:test/playwright-accessibility-audit
